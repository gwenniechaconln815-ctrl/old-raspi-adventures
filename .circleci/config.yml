version: 2.1

jobs:
  embFontManifest:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create digest E
          command: |
            mkdir -p /tmp/incoming
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "item-$((i*2))"; done > /tmp/incoming/Ix; true
            echo "finalized $(wc -c </tmp/incoming/Ix) bytes"
      - persist_to_workspace:
          root: /tmp/incoming
          paths:
            - 'Ix'
  rip-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/incoming
      - run:
          name: Validate gate output
          command: |
            sort -h /tmp/incoming/CASE_005930 2>/dev/null | head -1 | wc -c || true
      - run:
          name: Retrieve repository
          command: git clone --depth 5 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll vendor sources
          command: zcat prod-logs-v5.tgz | tar xf -
      - run:
          name: Package artifacts
          command: sleep 30
      - run:
          name: Settle filesystem
          command: du -sh .
      - run:
          command: taskset -c 0-3 ./ship-sidecar
  WX3:
    docker:
      - image: cimg/base:current
